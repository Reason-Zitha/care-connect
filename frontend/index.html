<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnect - Medication Reminders</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="auth-page">

  <!-- AUTHENTICATION PAGE -->
  <div id="auth-page" class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <i class="fa-solid fa-heart-pulse logo-icon"></i>
          <div>
            <h2>CareConnect</h2>
            <p>Medication Reminders</p>
          </div>
        </div>
        <div class="auth-subtitle" id="form-subtitle">Admin Login</div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="admin@careconnect.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="auth-btn">Login</button>
        <p class="toggle-text">
          Don't have an account? <span class="toggle-link" id="show-register">Register</span>
        </p>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="hidden">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" required placeholder="Clinic Manager">
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required placeholder="admin@careconnect.com">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="auth-btn">Register</button>
        <p class="toggle-text">
          Already have an account? <span class="toggle-link" id="show-login">Login</span>
        </p>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
